# actionlint 1.7.12 predates two GitHub Actions features these workflows use:
# self-repository references (uses: $/..., July 2026) and background steps.
# Remove each ignore once actionlint supports the feature.
paths:
    .github/workflows/**/*.{yml,yaml}:
        ignore:
            - 'unexpected key "background" for step'
            - 'specifying action "\$/[^"]+" in invalid format because ref is missing'
            - 'reusable workflow call "\$/[^"]+" at "uses" is not following the format'
