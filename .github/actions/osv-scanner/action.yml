name: OSV Dependency Audit
description: |
    Audit the bun-locked npm dependencies with osv-scanner. A clean result is cached and reused for the rest of the ISO
    week until package.json or bun.lock changes; force-scan always rescans and seeds that cache. The repository must
    already be checked out.

    Required job permissions:
      contents: read          checkout and code scanning upload
      security-events: write  only when upload-sarif is 'true'
      actions: read           only when upload-sarif is 'true' in a private or internal repository

    Cache and artifact steps use the runner's Actions runtime token, not GITHUB_TOKEN. Cache writes follow the job's
    effective cache-mode, so low-trust triggers restore but never seed.

inputs:
    force-scan:
        description: "'true' skips the cached result, rescans, and preserves the SARIF report as the osv-scanner-weekly artifact."
        required: false
        default: 'false'
    sarif-path:
        description: Path of the SARIF report, relative to the workspace.
        required: false
        default: osv-results.sarif
    upload-sarif:
        description: "'true' uploads findings to code scanning. Set it only for events whose token can hold security-events: write; fork pull requests cannot."
        required: false
        default: 'false'

runs:
    using: composite
    steps:
        - name: Validate Inputs
          shell: bash
          env:
              FORCE_SCAN: ${{ inputs.force-scan }}
              UPLOAD_SARIF: ${{ inputs.upload-sarif }}
          run: |
              require_boolean() {
                case "$2" in
                  true | false) ;;
                  *)
                    echo "::error title=Invalid input::$1 must be 'true' or 'false'"
                    exit 1
                    ;;
                esac
              }

              require_boolean force-scan "$FORCE_SCAN"
              require_boolean upload-sarif "$UPLOAD_SARIF"

        - name: Resolve Audit Cache Key
          id: audit-key
          shell: bash
          run: echo "value=osv-v1-${RUNNER_OS}-$(date -u +%G-W%V)-${LOCK_HASH}" >> "$GITHUB_OUTPUT"
          env:
              LOCK_HASH: ${{ hashFiles('package.json', 'bun.lock', 'osv-scanner.toml') }}

        - id: cache
          if: ${{ inputs.force-scan != 'true' }}
          uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          name: Restore Previously Cached Scan
          with:
              path: ${{ inputs.sarif-path }}
              key: ${{ steps.audit-key.outputs.value }}

        - id: audit
          if: ${{ inputs.force-scan == 'true' || steps.cache.outputs.cache-hit != 'true' }}
          name: Audit Dependencies
          uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
          with:
              scan-args: |-
                  --lockfile=./bun.lock
                  --config=./osv-scanner.toml
                  --format=sarif
                  --output=${{ inputs.sarif-path }}

        - name: Save Clean Audit
          if: ${{ steps.audit.outcome == 'success' }}
          uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
          with:
              path: ${{ inputs.sarif-path }}
              key: ${{ steps.audit-key.outputs.value }}

        - name: Preserve Weekly Audit Report
          if: ${{ inputs.force-scan == 'true' && !cancelled() && hashFiles(inputs.sarif-path) != '' }}
          uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
          with:
              name: osv-scanner-weekly
              path: ${{ inputs.sarif-path }}
              retention-days: 30
              if-no-files-found: error

        - name: Upload Security Findings
          if: ${{ inputs.upload-sarif == 'true' && !cancelled() && hashFiles(inputs.sarif-path) != '' }}
          uses: github/codeql-action/upload-sarif@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
          with:
              sarif_file: ${{ inputs.sarif-path }}
              category: osv-scanner
