github:
    - changed-files:
          - any-glob-to-any-file:
                - .github/**

tooling:
    - changed-files:
          - any-glob-to-any-file:
                - .pre-commit-config.yaml
                - eslint.config.ts
                - .oxlintrc.json
                - prettier.config.ts
                - .prettierignore
                - tsconfig.json

claude-config:
    - changed-files:
          - any-glob-to-any-file:
                - .claude/**
                - CLAUDE.md

source:
    - changed-files:
          - any-glob-to-any-file:
                - src/**
                - dist/**

tests:
    - changed-files:
          - any-glob-to-any-file:
                - tests/**
                - '**/tests/**'
                - '**/*.{test,spec}.{js,jsx,ts,tsx}'
                - vitest.config.*

scripts:
    - changed-files:
          - any-glob-to-any-file:
                - scripts/**
                - .github/scripts/**
                - Makefile
                - justfile

docs:
    - changed-files:
          - any-glob-to-any-file:
                - docs/**
                - README.md
                - CHANGELOG.md
                - SECURITY.md
                - CONTRIBUTING.md
                - LICENSE
                - LICENSE.md

supply-chain:
    - changed-files:
          - any-glob-to-any-file:
                - package.json
                - '**/package.json'
                - package-lock.json
                - bun.lock
                - bun.lockb
                - pnpm-lock.yaml
                - yarn.lock
                - bunfig.toml
                - .npmrc
                - .github/dependabot.yml
                - .github/dependabot.yaml

'plugin:manifest':
    - changed-files:
          - any-glob-to-any-file:
                - .claude-plugin/**

'plugin:settings':
    - changed-files:
          - any-glob-to-any-file:
                - settings.json

'plugin:skills':
    - changed-files:
          - any-glob-to-any-file:
                - skills/**
                - SKILL.md

'plugin:subagents':
    - changed-files:
          - any-glob-to-any-file:
                - agents/**

'plugin:commands':
    - changed-files:
          - any-glob-to-any-file:
                - commands/**

'plugin:hooks':
    - changed-files:
          - any-glob-to-any-file:
                - hooks/**
                - scripts/hooks/**

'plugin:mods':
    - changed-files:
          - any-glob-to-any-file:
                - mods/**
                - 'hooks/**/register.{js,mjs,ts,mts}'

'plugin:mcp':
    - changed-files:
          - any-glob-to-any-file:
                - .mcp.json
                - mcp/**
                - mcp-servers/**
                - '**/*.mcpb'
                - '**/*.dxt'

'plugin:lsp':
    - changed-files:
          - any-glob-to-any-file:
                - .lsp.json
                - lsp/**
                - language-servers/**

'plugin:output-styles':
    - changed-files:
          - any-glob-to-any-file:
                - output-styles/**

'plugin:workflows':
    - changed-files:
          - any-glob-to-any-file:
                - workflows/**

'plugin:themes':
    - changed-files:
          - any-glob-to-any-file:
                - themes/**

'plugin:monitors':
    - changed-files:
          - any-glob-to-any-file:
                - monitors/**

'plugin:executables':
    - changed-files:
          - any-glob-to-any-file:
                - bin/**

'plugin:evals':
    - changed-files:
          - any-glob-to-any-file:
                - evals/**
